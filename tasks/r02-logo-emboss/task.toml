type = "ray_probe"
label = "probe_carton"
tol = 0.0003
probes = [
  { name = "front face beside the plaque", origin = [0.03, -0.05, 0.05], dir = [0, 1, 0], hit = 0.03 },
  { name = "back face", origin = [0.0, 0.05, 0.05], dir = [0, -1, 0], hit = 0.03 },
  { name = "side +X", origin = [0.05, 0.0, 0.05], dir = [-1, 0, 0], hit = 0.015 },
  { name = "side -X", origin = [-0.05, 0.0, 0.05], dir = [1, 0, 0], hit = 0.015 },

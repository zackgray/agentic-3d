  { name = "outer wall -Y at z 45", origin = [0.0, -0.05, 0.045], dir = [0, 1, 0], hit = 0.02 },
  { name = "outer wall +X at z 88", origin = [0.05, 0.0, 0.088], dir = [-1, 0, 0], hit = 0.02 },

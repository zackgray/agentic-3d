id = "r04-move-holes"
title = "Revision: bigger mounting holes, moved inboard"
group = "revision"
starting_scene = "start.py"

prompt = """
The open Blender scene holds an approved model of a hypothetical product part: a flat mounting plate with a large centre hole and four mounting holes near its corners (mesh object "Plate"). Units are metres (1 Blender unit = 1 m). The client has one revision:

- The four mounting holes grow to 6.5 mm diameter, still straight through the plate.
- Each mounting hole moves 5 mm inboard in X and 5 mm inboard in Y, towards the plate centre. The holes stay symmetric about both the X and Y axes.
- The old hole positions are filled: no trace of the old holes remains.
- Everything else stays exactly as it is: the plate outline, its thickness and corner radii, and the centre hole.

The object keeps its name. It stays a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections, transforms applied (location at the origin, no rotation, scale 1), and at most 20,000 faces. No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Plate"]

[[checks]]
type = "transforms_applied"
objects = ["Plate"]

[[checks]]
type = "bbox"
object = "Plate"
min = [-0.06, -0.04, 0.0]
max = [0.06, 0.04, 0.006]
tol = 0.0001

[[checks]]
type = "watertight"
objects = ["Plate"]

[[checks]]
type = "shells"
objects = ["Plate"]

[[checks]]
type = "self_intersection"
objects = ["Plate"]

[[checks]]
type = "topology"
objects = ["Plate"]

[[checks]]
type = "face_budget"
object = "Plate"
max = 20000

# 6*(120*80 - (4-pi)*6^2 - pi*10^2 - 4*pi*3.25^2); the hole change is 325 mm3 = 0.59%
[[checks]]
type = "volume"
object = "Plate"
mm3 = 54733
rel_tol = 0.002


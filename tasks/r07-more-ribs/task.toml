id = "r07-more-ribs"
title = "Revision: 16 grip ribs instead of 12"
group = "revision"
starting_scene = "start.py"

prompt = """
The open Blender scene holds an approved model of a hypothetical product part: a round tool grip with straight ribs running along its length, all one solid (mesh object "Grip"). Units are metres (1 Blender unit = 1 m). The grip stands on the ground plane with its axis on the world Z axis. The client has one revision:

- The grip currently has 12 ribs. Change it to 16 ribs, evenly spaced around the grip (every 22.5 degrees).
- Every rib keeps exactly the current rib profile (width, height and flat top) and the current rib length and end positions. Keep the rib that is centred on the +X axis where it is; the others are spaced evenly from it.
- The ribs are fused to the grip body. Nothing else changes: the body's diameter, height and position stay exactly as they are.

The object keeps its name. It stays a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections, transforms applied (location at the origin, no rotation, scale 1), and at most 20,000 faces. No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Grip"]

[[checks]]
type = "transforms_applied"
objects = ["Grip"]

[[checks]]
type = "bbox"
object = "Grip"
min = [-0.0135, -0.0135, 0.0]
max = [0.0135, 0.0135, 0.08]
tol = 0.0002

[[checks]]
type = "watertight"
objects = ["Grip"]

[[checks]]
type = "shells"
objects = ["Grip"]

[[checks]]
type = "self_intersection"
objects = ["Grip"]

[[checks]]
type = "topology"
objects = ["Grip"]

[[checks]]
type = "face_budget"
object = "Grip"
max = 20000

# body pi*12^2*80 + 16 ribs * 60 * A, with A the rib section outside the body:
# A = 2*13.5 - integral_{-1}^{1} sqrt(12^2 - y^2) dy = 27 - (sqrt(143) + 144*asin(1/12)) = 3.028.
# 4 more ribs add 727 mm3 = 1.9%.
[[checks]]
type = "volume"
object = "Grip"
mm3 = 39098
rel_tol = 0.01


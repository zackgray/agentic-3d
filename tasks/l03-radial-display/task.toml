id = "l03-radial-display"
title = "Ring of products around a plinth, flats facing out"
group = "layout"
starting_scene = "empty"

prompt = """
Lay out a product shot in the open Blender scene: eight identical hypothetical products standing in a ring around a central display plinth, each turned so its label flat faces outward, as nine mesh objects. Units are metres (1 Blender unit = 1 m). Everything stands on the ground plane (flat bottoms at z = 0), centred on the world Z axis.

Plinth (mesh object "Plinth"): a solid vertical cylinder 120 mm in diameter, from z = 0 to a flat top at z = 100 mm, its axis on the world Z axis. All edges sharp.

Products (mesh objects "Product_1" to "Product_8"): each is a solid vertical cylinder 40 mm in diameter and 80 mm tall (z = 0 to a flat top at z = 80 mm) with one flat label face cut along its full height: a vertical plane 15 mm from the product's own axis, so the flat is about 26.5 mm wide. All edges sharp.

Arrangement:
- The product axes stand on a circle of radius 120 mm centred on the world origin, spaced evenly at 45 degrees.
- "Product_1" sits on the +X axis (at x = 120 mm, y = 0). Numbering continues counter-clockwise seen from above (+Z): "Product_2" at 45 degrees, "Product_3" on the +Y axis, and so on to "Product_8" at 315 degrees.
- Each product is turned about its own vertical axis so its label flat faces directly outward, away from the plinth: the outward normal of the flat points radially away from the world Z axis through the product's axis.

Every object:
- A single closed (watertight) mesh, one connected piece, with consistent outward normals and no self-intersections. No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 5,000 faces each.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Plinth", "Product_1", "Product_2", "Product_3", "Product_4", "Product_5", "Product_6", "Product_7", "Product_8"]


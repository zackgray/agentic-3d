id = "m02-portable-speaker"
title = "Portable speaker: cylinder with an 80-hole grille, feet and three top buttons"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a cylindrical portable speaker with a perforated grille, four feet and three control buttons, as four separate mesh objects. Units are metres (1 Blender unit = 1 m). The speaker stands upright on its feet on the ground plane, centred on the world Z axis. Angles around the Z axis are measured from +X towards +Y.

Body (mesh object "Body"), one solid part:
- Shell: a solid cylinder 80 mm in diameter from a flat underside at z = 5 mm to a flat top at z = 150 mm. All edges are sharp.
- Feet: four solid cylinders 12 mm in diameter, from the ground plane (z = 0) up to the underside, with their axes vertical at (x, y) = (+20, +20), (-20, +20), (-20, -20) and (+20, -20) mm, fused to the body.
- Grille: 80 round blind holes in a regular array on the curved side: 5 rows at z = 45, 60, 75, 90 and 105 mm, and 16 holes per row at angles 0, 22.5, 45, ... 337.5 degrees (every 22.5 degrees, the first on the +X axis), the same angles in every row. Each hole is 5 mm in diameter, its axis horizontal and pointing straight at the Z axis, with a flat floor perpendicular to its axis, 38 mm from the Z axis (2 mm deep measured along the hole's axis).
- Button pockets: three flat-bottomed blind holes 12 mm in diameter in the top face, centred at (x, y) = (-15, 0), (0, 0) and (+15, 0) mm, from the top down to floors at z = 147 mm.

Buttons (mesh objects "ButtonMinus" at x = -15 mm, "ButtonPower" at x = 0 and "ButtonPlus" at x = +15 mm, all at y = 0): each a solid cylinder 11 mm in diameter from z = 147.5 mm to z = 152 mm, standing in its pocket 0.5 mm above the pocket floor with 0.5 mm clearance all round, and protruding 2 mm above the top face.

All four objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 40,000 faces for the body and 20,000 faces for each button.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "transforms_applied"
objects = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "bbox"
label = "bbox_body"
object = "Body"
min = [-0.04, -0.04, 0.0]
max = [0.04, 0.04, 0.15]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_minus"
object = "ButtonMinus"
min = [-0.0205, -0.0055, 0.1475]
max = [-0.0095, 0.0055, 0.152]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_power"
object = "ButtonPower"
min = [-0.0055, -0.0055, 0.1475]
max = [0.0055, 0.0055, 0.152]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_plus"
object = "ButtonPlus"
min = [0.0095, -0.0055, 0.1475]
max = [0.0205, 0.0055, 0.152]
tol = 0.0003

[[checks]]
type = "watertight"
objects = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "shells"
objects = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "self_intersection"
objects = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "topology"
objects = ["Body", "ButtonMinus", "ButtonPlus", "ButtonPower"]

[[checks]]
type = "face_budget"
label = "face_budget_body"
object = "Body"
max = 40000

[[checks]]
type = "face_budget"
label = "face_budget_buttons"
objects = ["ButtonMinus", "ButtonPlus", "ButtonPower"]
max = 20000

[[checks]]
type = "no_overlap"
label = "no_overlap_minus"
a = "Body"
b = "ButtonMinus"

[[checks]]
type = "no_overlap"
label = "no_overlap_power"
a = "Body"
b = "ButtonPower"

[[checks]]
type = "no_overlap"
label = "no_overlap_plus"
a = "Body"
b = "ButtonPlus"

# pi*40^2*145 + feet 4*pi*6^2*5 - pockets 3*pi*6^2*3
#   - holes 80 * integral over the 5 mm disc of (sqrt(40^2 - u^2) - 38) dA = 80 * 38.886

id = "l01-jar-grid"
title = "Jar grid on a display tray"
group = "layout"
starting_scene = "empty"

prompt = """
Lay out a product shot in the open Blender scene: twelve identical hypothetical jars standing in a grid on a display tray, as thirteen mesh objects. Units are metres (1 Blender unit = 1 m). The tray sits on the ground plane, centred on the world Z axis.

Tray (mesh object "Tray"): a solid rectangular slab 300 mm in X by 220 mm in Y and 10 mm thick, from z = 0 to its flat top at z = 10 mm, centred on the origin in X and Y. All edges sharp.

Jars (mesh objects "Jar_1" to "Jar_12"): each jar is a solid cylinder 50 mm in diameter and 60 mm tall with its axis vertical and flat top and bottom.

- The jars form a grid of 4 columns along X by 3 rows along Y, at a pitch of 70 mm centre-to-centre in both X and Y. The grid is centred on the origin in X and Y.
- Every jar's flat bottom is 0.5 mm above the tray top (a 0.5 mm clearance, so jar and tray do not touch).
- Numbering: "Jar_1" to "Jar_4" are the front row (most negative Y), numbered from -X to +X; "Jar_5" to "Jar_8" are the middle row, from -X to +X; "Jar_9" to "Jar_12" are the back row (most positive Y), from -X to +X.

Every object:
- A single closed (watertight) mesh, one connected piece, with consistent outward normals and no self-intersections. No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 5,000 faces each.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Tray", "Jar_1", "Jar_2", "Jar_3", "Jar_4", "Jar_5", "Jar_6", "Jar_7", "Jar_8", "Jar_9", "Jar_10", "Jar_11", "Jar_12"]

[[checks]]
type = "transforms_applied"
objects = ["Tray", "Jar_1", "Jar_2", "Jar_3", "Jar_4", "Jar_5", "Jar_6", "Jar_7", "Jar_8", "Jar_9", "Jar_10", "Jar_11", "Jar_12"]

[[checks]]

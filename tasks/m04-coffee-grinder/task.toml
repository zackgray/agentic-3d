id = "m04-coffee-grinder"
title = "Hand coffee grinder: body with drawer recess, hopper, lid, crank and knob"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a manual coffee grinder, as five separate mesh objects. Units are metres (1 Blender unit = 1 m). The body stands on the ground plane, centred on the world Z axis; the drawer faces -Y and the crank arm points along +X.

Body (mesh object "Body"), one solid part:
- Block: seen from above, a square 80 mm by 80 mm (x and y from -40 mm to +40 mm) whose four vertical corners are rounded with an 8 mm radius, from z = 0 to a flat top at z = 100 mm. All other edges are sharp.
- Drawer recess: a rectangular pocket in the -Y face with sharp corners and a flat floor, from x = -30 mm to +30 mm and z = 20 mm to 55 mm, 5 mm deep (its floor at y = -35 mm).

Hopper (mesh object "Hopper"), an open-top cup:
- A cylinder 70 mm in outer diameter from its flat underside at z = 100.5 mm (0.5 mm above the body) to its rim at z = 140 mm.
- Hollow: the wall is 3 mm thick (inside 64 mm across) and the floor is 3 mm thick (inside floor at z = 103.5 mm). The rim is a flat ring and the top is open.

Lid (mesh object "Lid"): a flat disc 74 mm in diameter from z = 140.5 mm (0.5 mm above the rim) to z = 144.5 mm, with a central through-hole 9 mm in diameter.

Crank (mesh object "Crank"), one solid part made of three fused pieces:
- Shaft: a vertical cylinder 8 mm in diameter on the Z axis, from its flat bottom at z = 115 mm (inside the hopper) up through the lid hole (clearing it by 0.5 mm all round) to the arm.
- Arm: a box from x = -8 mm to +60 mm, y = -5 mm to +5 mm and z = 150 mm to 158 mm.
- Pin: a vertical cylinder 6 mm in diameter at (x, y) = (+55, 0) mm, standing on the arm's top face and rising to a flat top at z = 178 mm.

Knob (mesh object "Knob"): a cylinder 16 mm in diameter at (x, y) = (+55, 0) mm, from z = 158.5 mm (0.5 mm above the arm) to a flat top at z = 185 mm, with a flat-topped blind bore 7 mm in diameter up into its bottom from z = 158.5 mm to z = 178.5 mm. It sits over the pin, clearing it by 0.5 mm all round and over its top.

All five objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]

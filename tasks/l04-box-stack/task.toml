id = "l04-box-stack"
title = "Pyramid of shipping boxes"
group = "layout"
starting_scene = "empty"

prompt = """
Lay out a product shot in the open Blender scene: six identical hypothetical shipping boxes stacked as a small three-layer pyramid, as six mesh objects. Units are metres (1 Blender unit = 1 m). The stack stands on the ground plane, centred on the world Z axis.

Each box (mesh objects "Box_1" to "Box_6") is a solid rectangular block 100 mm in X, 80 mm in Y and 60 mm in Z, with sharp edges, its sides parallel to the world axes (no rotation). Every box is centred on y = 0.

- Bottom layer: "Box_1", "Box_2" and "Box_3" stand on the ground (bottoms at z = 0) in a row along X, numbered from -X to +X, with a 10 mm gap between neighbouring boxes. The row is centred on the origin in X.
- Middle layer: "Box_4" (on the -X side) and "Box_5" (on the +X side). Each is centred in X over the gap between the two bottom boxes beneath it, and its bottom is 0.5 mm above the tops of the bottom layer.
- Top layer: "Box_6", centred in X over the gap between "Box_4" and "Box_5", its bottom 0.5 mm above the tops of the middle layer.

Every object:
- A single closed (watertight) mesh, one connected piece, with consistent outward normals and no self-intersections. No two boxes touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 1,000 faces each.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "transforms_applied"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "watertight"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "shells"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "self_intersection"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "topology"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]

[[checks]]
type = "face_budget"
objects = ["Box_1", "Box_2", "Box_3", "Box_4", "Box_5", "Box_6"]
max = 1000

[[checks]]

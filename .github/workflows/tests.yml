name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Unit tests only: no Blender, no network. tests/harness_selftest.py and
      # tests/read_stress.py need a live Blender and stay out of CI (testpaths in pyproject.toml).
      - name: Unit tests
        run: python -m pytest

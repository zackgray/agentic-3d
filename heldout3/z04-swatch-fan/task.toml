label = "bbox_pin"
object = "Pin"
min = [-0.006, -0.006, 0.0]
max = [0.006, 0.006, 0.022]
tol = 0.0003

# (160*40 - (4-pi)*6^2) * 3 - pi*3^2*3; flat plate, curved area is a small share
[[checks]]
type = "volume"
label = "volume_blade_1"
object = "Blade_1"
mm3 = 19022
rel_tol = 0.01

# same as Blade_1
[[checks]]
type = "volume"
label = "volume_blade_4"
object = "Blade_4"
mm3 = 19022
rel_tol = 0.01

# 2 * pi*6^2*2 + pi*2.5^2*18; all curved, so 2% (a 24-segment build is 1.1% under)
[[checks]]
type = "volume"
label = "volume_pin"
object = "Pin"
mm3 = 805.8
rel_tol = 0.02


id = "z04-swatch-fan"
title = "Colour-swatch fan: five blades turned about an off-centre pivot pin, stacked with clearances"
group = "layout"
starting_scene = "empty"

prompt = """
Lay out a product shot in the open Blender scene: a hypothetical colour-swatch fan deck, opened out, as six mesh objects: five flat swatch blades fanned about a pivot pin. Units are metres (1 Blender unit = 1 m). The pin stands on the ground plane with its axis on the world Z axis, which is the pivot of the fan.

Pin (mesh object "Pin"), one solid part, three coaxial cylinders on the world Z axis with flat ends and sharp edges, fused: a bottom head 12 mm in diameter from z = 0 to z = 2 mm, a shaft 5 mm in diameter from z = 2 mm to z = 20 mm, and a top head 12 mm in diameter from z = 20 mm to z = 22 mm.

Blades (mesh objects "Blade_1" to "Blade_5"), five identical flat plates, each 3 mm thick with flat top and bottom faces. Describe one blade in its own frame first, before it is turned: seen from above it is a rectangle 160 mm long along +X and 40 mm wide in Y, whose four vertical corners are rounded with a 6 mm radius, running from x = -12 mm to x = +148 mm and from y = -20 mm to y = +20 mm, so its long axis lies on the X axis. It has one round pivot hole straight through it, 6 mm in diameter, centred at (x, y) = (0, 0), that is 12 mm from its near end. All edges other than the corner roundings are sharp.

Arrangement:
- Every blade's pivot hole is centred on the world Z axis, around the pin's shaft (0.5 mm clearance all round).
- Each blade is turned about the world Z axis (the pivot), counter-clockwise seen from above (+Z): "Blade_1" is not turned (its long axis points along +X), "Blade_2" is turned 15 degrees, "Blade_3" 30 degrees, "Blade_4" 45 degrees and "Blade_5" 60 degrees.
- The blades are stacked bottom to top in order, with a 0.5 mm air gap between neighbours and above the bottom head: "Blade_1" from z = 2.5 mm to z = 5.5 mm, "Blade_2" from z = 6 mm to z = 9 mm, "Blade_3" from z = 9.5 mm to z = 12.5 mm, "Blade_4" from z = 13 mm to z = 16 mm and "Blade_5" from z = 16.5 mm to z = 19.5 mm (0.5 mm below the top head).

Every object:
- A single closed (watertight) mesh, one connected piece, with consistent outward normals and no self-intersections. No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 5,000 faces each.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "transforms_applied"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "watertight"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "shells"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "self_intersection"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "topology"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]

[[checks]]
type = "face_budget"
objects = ["Blade_1", "Blade_2", "Blade_3", "Blade_4", "Blade_5", "Pin"]
max = 5000

# Blade bounds: the rotated rectangle of corner-arc centres (x -6..142, y -14..14) grown by the
# 6 mm corner radius. A 24-segment corner falls short of the true extreme by at most 0.05 mm.
[[checks]]
type = "bbox"
label = "bbox_blade_1"
object = "Blade_1"
min = [-0.012, -0.02, 0.0025]
max = [0.148, 0.02, 0.0055]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_blade_2"
object = "Blade_2"
min = [-0.015419, -0.0210759, 0.006]
max = [0.1467849, 0.0562753, 0.009]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_blade_3"
object = "Blade_3"
min = [-0.0181962, -0.0211244, 0.0095]
max = [0.1359756, 0.0891244, 0.0125]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_blade_4"
object = "Blade_4"
min = [-0.0201421, -0.0201421, 0.013]
max = [0.1163087, 0.1163087, 0.016]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_blade_5"
object = "Blade_5"
min = [-0.0211244, -0.0181962, 0.0165]
max = [0.0891244, 0.1359756, 0.0195]
tol = 0.0003

[[checks]]

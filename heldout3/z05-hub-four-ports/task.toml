id = "z05-hub-four-ports"
title = "Revision: four front ports instead of three, same pitch, re-centred"
group = "revision"
starting_scene = "start.py"

prompt = """
The open Blender scene holds an approved model of a hypothetical product: the solid body of a desktop charging hub, a rounded slab with a row of port recesses in its front face and a round button recess on top (mesh object "Hub"). The front is the face that looks towards -Y. Units are metres (1 Blender unit = 1 m). The client has one revision:

- The row of three port recesses in the front face becomes a row of four.
- Every port keeps exactly the current recess shape: the same width, height and corner radii, the same depth, and the same height above the ground. Each still opens in the front face and runs straight in along +Y.
- The centre-to-centre spacing between neighbouring ports stays exactly what it is now. The row of four is centred left to right on the front face (symmetric about the plane x = 0).
- Any old port opening that is not part of the new row is filled flush with the front face: no trace of it remains.
- Everything else stays exactly as it is: the body's outline, height and plan corner radii, the rounded top edge, and the button recess on top.

The object keeps its name. It stays a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections, transforms applied (location at the origin, no rotation, scale 1), and at most 20,000 faces. No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Hub"]

[[checks]]
type = "transforms_applied"
objects = ["Hub"]

[[checks]]
type = "bbox"
object = "Hub"
min = [-0.07, -0.035, 0.0]
max = [0.07, 0.035, 0.028]
tol = 0.0002

[[checks]]
type = "watertight"
objects = ["Hub"]

[[checks]]
type = "shells"
objects = ["Hub"]

[[checks]]
type = "self_intersection"
objects = ["Hub"]

[[checks]]
type = "topology"
objects = ["Hub"]

[[checks]]
type = "face_budget"
object = "Hub"
max = 20000

# 28*(140*70 - (4-pi)*10^2) - fillet [P*r^2*(1-pi/4) - pi*r^3*(5/3-pi/2), r = 4, P = 2*(140+70) - 8*10 + 2*pi*10]
# - 4 ports * 15*(14*7 - (4-pi)*1.5^2) - button pi*6^2*1. One port is 1441 mm3 = 0.54%, the fillet
# 1364 mm3 = 0.52%; a 24-segment build of the corners and button loses ~0.04%.
[[checks]]
type = "volume"
object = "Hub"
mm3 = 264755
rel_tol = 0.0025


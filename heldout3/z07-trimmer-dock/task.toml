id = "z07-trimmer-dock"
title = "Beard trimmer in its dock: chamfered dock with socket, tapered body with slider, flared head, slotted blade"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a cordless beard trimmer standing upright in its charging dock, as five separate mesh objects. Units are metres (1 Blender unit = 1 m). The dock stands on the ground plane and every part is centred on the world Z axis in plan (except where a position is given); the front of the trimmer faces -Y.

A "rounded rectangle W by D, radius r" below is a rectangle W mm in X by D mm in Y, centred on the Z axis, whose four corners are rounded with radius r.

Dock (mesh object "Dock"), one solid part:
- Block: a rounded rectangle 64 by 50, radius 10 (x from -32 mm to +32 mm, y from -25 mm to +25 mm), with vertical sides from z = 0 up to z = 21 mm.
- Chamfer: the top edge all the way round is a 3 mm by 3 mm 45-degree chamfer, so the flat top face at z = 24 mm is a rounded rectangle 58 by 44, radius 7. The bottom edge is sharp.
- Socket: a pocket in the top face, a rounded rectangle 36 by 26, radius 6, with vertical walls from the top down to a flat floor at z = 8 mm. Its edges are sharp.

Body (mesh object "Body"), one solid part:
- A tapered column from a flat bottom at z = 8.5 mm (0.5 mm above the socket floor) to a flat top at z = 130 mm. Every horizontal section is a rounded rectangle with radius 5.5 and a constant 25 mm in Y (y from -12.5 mm to +12.5 mm). Its width in X shrinks linearly with height, from 35 mm at z = 8.5 mm (x from -17.5 to +17.5 mm, clearing the socket walls by 0.5 mm all round) to 29 mm at z = 130 mm (x from -14.5 to +14.5 mm). So the front and back faces are vertical and the two side faces lean inward. All edges are sharp.
- Slider pocket: a pocket in the flat front face (y = -12.5 mm) shaped, seen from the front, as a vertical stadium 8 mm wide (x from -4 mm to +4 mm) from z = 75 mm to z = 95 mm, with semicircular ends of radius 4 mm. Its walls run along Y to a flat floor at y = -11 mm (1.5 mm deep).

Slider (mesh object "Slider"): a solid stadium prism along Y, seen from the front a vertical stadium 7 mm wide (x from -3.5 mm to +3.5 mm) from z = 75.5 mm to z = 94.5 mm with semicircular ends of radius 3.5 mm, from its back face at y = -11.5 mm (0.5 mm in front of the pocket floor) to its flat front face at y = -14 mm. It clears the pocket walls by 0.5 mm all round and stands 1.5 mm proud of the front face.

Head (mesh object "Head"), one solid part: a flared loft from a flat bottom at z = 130.5 mm (0.5 mm above the body top) to a flat top at z = 150 mm. Its bottom section is a rounded rectangle 29 by 25, radius 5.5; its top section is a rounded rectangle 44 by 12, radius 3. In between, each section is a rounded rectangle whose X width, Y depth and corner radius change linearly with height (so it widens in X and narrows in Y; the faces are straight from bottom to top).

Blade (mesh object "Blade"), one solid part: a flat plate, a box from x = -20 mm to +20 mm, y = -2 mm to +2 mm, z = 150.5 mm (0.5 mm above the head top) to z = 160 mm, with nine comb slots cut down into its top edge. Each slot is 2 mm wide in X, runs right through the plate in Y, and has a flat floor at z = 156 mm (4 mm deep). The slots are centred at x = -16, -12, -8, -4, 0, +4, +8, +12 and +16 mm. All edges are sharp.

All five objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Blade", "Body", "Dock", "Head", "Slider"]

[[checks]]
type = "transforms_applied"
objects = ["Blade", "Body", "Dock", "Head", "Slider"]


# A(W,D,r) = W*D - (4-pi)*r^2 for a rounded rectangle.
# 21*A(64,50,10) + chamfer band 3/6*(A(64,50,10) + 4*A(61,47,8.5) + A(58,44,7)) - socket 16*A(36,26,6)
[[checks]]
type = "volume"
label = "volume_dock"
object = "Dock"
mm3 = 59338
rel_tol = 0.01

# 121.5*(32*25 - (4-pi)*5.5^2) - slider pocket 1.5*(8*12 + pi*4^2)
[[checks]]
type = "volume"
label = "volume_body"
object = "Body"
mm3 = 93826
rel_tol = 0.01

# 2.5*(7*12 + pi*3.5^2); mostly round ends, so 2%
[[checks]]
type = "volume"
label = "volume_slider"
object = "Slider"
mm3 = 306.2
rel_tol = 0.02

# Linear sections, so Simpson is exact: 19.5/6*(A(29,25,5.5) + 4*A(36.5,18.5,4.25) + A(44,12,3))
[[checks]]

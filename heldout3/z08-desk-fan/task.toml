[[checks]]
type = "ray_probe"
label = "probe_motor"
objects = ["Motor"]
tol = 0.0003
probes = [
  { name = "front face", origin = [0.01, -0.05, 0.1355], dir = [0, 1, 0], hit = 0.03 },
  { name = "rear face", origin = [0.0, 0.08, 0.1355], dir = [0, -1, 0], hit = 0.04 },
  { name = "top of the side", origin = [0.0, 0.0, 0.2], dir = [0, 0, -1], hit = 0.0395 },

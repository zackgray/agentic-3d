  { name = "base side -Y", origin = [0.0, -0.08, 0.007], dir = [0, 1, 0], hit = 0.035 },
  { name = "plan corner radius 15", origin = [0.07, 0.055, 0.007], dir = [-1, -1, 0], hit = 0.020355 },
  { name = "chamfer from the side at z 16", origin = [0.09, 0.0, 0.016], dir = [-1, 0, 0], hit = 0.032 },

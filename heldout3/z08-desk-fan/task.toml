  { name = "dial pocket floor", origin = [0.038, -0.02, 0.05], dir = [0, 0, -1], hit = 0.038 },
  { name = "dial pocket wall", origin = [0.038, -0.02, 0.015], dir = [1, 0, 0], hit = 0.011 },

  { name = "floor (-85, -17)", origin = [-0.085, -0.017, 0.04], dir = [0, 0, -1], hit = 0.033 },
  { name = "floor (+51, -17)", origin = [0.051, -0.017, 0.04], dir = [0, 0, -1], hit = 0.033 },
  { name = "floor (-51, +17)", origin = [-0.051, 0.017, 0.04], dir = [0, 0, -1], hit = 0.033 },
  { name = "floor (+17, -17)", origin = [0.017, -0.017, 0.04], dir = [0, 0, -1], hit = 0.033 },
  { name = "floor (-17, +17)", origin = [-0.017, 0.017, 0.04], dir = [0, 0, -1], hit = 0.033 },

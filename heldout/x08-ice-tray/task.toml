  { name = "tapered wall at mid-depth -Y", origin = [-0.085, -0.017, 0.021], dir = [0, -1, 0], hit = 0.014 },
  { name = "tapered wall at mid-depth +Y", origin = [0.051, -0.017, 0.021], dir = [0, 1, 0], hit = 0.014 },
]


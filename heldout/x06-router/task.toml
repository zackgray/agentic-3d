id = "x06-router"
title = "Wi-Fi router: rounded body with vent slots, rear ports, LED holes, feet and a top button"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a small Wi-Fi router, as two separate mesh objects. Units are metres (1 Blender unit = 1 m). The router stands on its feet on the ground plane, centred on the world Z axis. Its back face is the side facing +Y and its front face is the side facing -Y.

Router (mesh object "Router"), one solid part:
- Body: a solid block 160 mm in X by 110 mm in Y (x from -80 mm to +80 mm, y from -55 mm to +55 mm), from a flat underside at z = 4 mm to a flat top at z = 34 mm. The four vertical corners are rounded with an 8 mm radius; all other edges of the body are sharp.
- Feet: four solid cylinders 12 mm in diameter with vertical axes at (x, y) = (+60, +35), (-60, +35), (-60, -35) and (+60, -35) mm, from z = 0 up to the underside, fused to it.
- Vent slots: nine straight slots cut into the top, each 4 mm wide in X and 60 mm long in Y (y from -30 mm to +30 mm), 3 mm deep with a flat floor at z = 31 mm and square ends, centred at x = -40, -30, -20, -10, 0, +10, +20, +30 and +40 mm.
- Rear ports: two rectangular pockets cut into the back face, each 14 mm wide in X and 8 mm tall in Z (z from 15 mm to 23 mm), 12 mm deep (flat floor at y = +43 mm), centred at x = -40 mm and x = -20 mm.
- Power socket: a round pocket 9 mm in diameter cut into the back face, its axis along Y at (x, z) = (+20, 19) mm, 12 mm deep with a flat floor at y = +43 mm.
- LED holes: three round holes 3 mm in diameter cut into the front face, axes along Y at z = 24 mm and x = -10, 0 and +10 mm, each 5 mm deep with a flat floor at y = -50 mm.
- Button pocket: a round pocket 12 mm in diameter in the top, its axis vertical at (x, y) = (+60, -35) mm, 3 mm deep with a flat floor at z = 31 mm.

Button (mesh object "Button"): a solid cylinder 11 mm in diameter, its axis vertical at (x, y) = (+60, -35) mm, from z = 31.5 mm to a flat top at z = 36 mm. It sits in the button pocket 0.5 mm above its floor, clears its wall by 0.5 mm all round and stands 2 mm proud of the top.

Both objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- The two objects do not touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Button", "Router"]

[[checks]]
type = "transforms_applied"
objects = ["Button", "Router"]

[[checks]]
type = "bbox"
label = "bbox_router"
object = "Router"
min = [-0.08, -0.055, 0.0]
max = [0.08, 0.055, 0.034]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_button"
object = "Button"
min = [0.0545, -0.0405, 0.0315]
max = [0.0655, -0.0295, 0.036]
tol = 0.0003

[[checks]]
type = "watertight"
objects = ["Button", "Router"]

[[checks]]
type = "shells"
objects = ["Button", "Router"]

[[checks]]
type = "self_intersection"
objects = ["Button", "Router"]

[[checks]]
type = "topology"
objects = ["Button", "Router"]

[[checks]]
type = "face_budget"
objects = ["Button", "Router"]
max = 20000

[[checks]]
type = "no_overlap"
a = "Router"
b = "Button"

# body 30*(160*110 - (4-pi)*8^2) + feet 4*pi*6^2*4 - slots 9*4*60*3 - ports 2*14*8*12 - power pi*4.5^2*12
#   - LEDs 3*pi*1.5^2*5 - button pocket pi*6^2*3

id = "y08"
title = "Battery lantern: recessed base, open diffuser tube, recessed cap with handle pockets, and a handle"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a battery lantern, as four separate mesh objects. Units are metres (1 Blender unit = 1 m). The lantern stands on the ground plane, centred on the world Z axis, with its handle running along X.

Base (mesh object "Base"), one solid part:
- A cylinder 90 mm in diameter from a flat underside at z = 0 to a flat top at z = 25 mm.
- Seat: a centred round recess 72 mm in diameter cut into the top, 3 mm deep with a flat floor at z = 22 mm.
- All edges are sharp.

Diffuser (mesh object "Diffuser"): the clear tube of the lantern (it gets a transparent material later; model it as plain geometry). A round tube on the Z axis, open at both ends, 71 mm in outside diameter with a uniform 3 mm wall (65 mm inside diameter), from a flat bottom rim at z = 22.5 mm to a flat top rim at z = 152.5 mm. It stands in the base's seat 0.5 mm above its floor and clears the seat wall by 0.5 mm all round. Sharp edges.

Cap (mesh object "Cap"), one solid part:
- A cylinder 90 mm in diameter from a flat underside at z = 150 mm to a flat top at z = 170 mm.
- Seat: a centred round recess 72 mm in diameter cut up into the underside, with a flat ceiling at z = 153 mm, so the top rim of the diffuser sits inside it 0.5 mm below the ceiling and 0.5 mm clear of its wall all round.
- Handle pockets: two square pockets cut down into the top, each 7 mm by 7 mm, centred at (x, y) = (-36, 0) mm and (+36, 0) mm, with flat floors at z = 160 mm and sharp corners.
- All other edges are sharp.

Handle (mesh object "Handle"), one connected solid made of three fused square-section bars, all 6 mm wide in Y (y from -3 mm to +3 mm), with sharp edges:
- Two legs, each 6 mm by 6 mm in plan, centred at (x, y) = (-36, 0) mm and (+36, 0) mm, from a flat bottom at z = 160.5 mm up to z = 206 mm. Each leg stands in a handle pocket 0.5 mm above its floor and clears its walls by 0.5 mm all round.
- A top bar from x = -39 mm to x = +39 mm, from z = 200 mm to a flat top at z = 206 mm, fused to the tops of both legs (its ends are flush with the legs' outer faces).

All four objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""


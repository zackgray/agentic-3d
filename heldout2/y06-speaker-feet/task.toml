id = "y06-speaker-feet"
title = "Revision: add four feet under the speaker"
group = "revision"
starting_scene = "start.py"

prompt = """
The open Blender scene holds an approved model of a hypothetical product: a small speaker box with a round recess in its front face (mesh object "Speaker"). The front is the -Y side. Units are metres (1 Blender unit = 1 m). The client has one revision:

- Add four identical feet under the base, one near each corner. Each foot is a plain upright cylinder, 24 mm in diameter and 10 mm tall, flat on top and bottom.
- Centre each foot 20 mm in from the nearest side face (X) and 20 mm in from the nearest front or back face (Y).
- The box itself doesn't move: the top of each foot meets the underside of the box, and the bottoms of the feet are 10 mm below it.
- Fuse the feet into the Speaker mesh, so the speaker and its feet are one solid. Don't add them as separate objects.
- Everything else stays exactly as it is: the box's size, its rounded corners, where it sits and the recess in its front.

The object keeps its name. It stays a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections, transforms applied (location at the origin, no rotation, scale 1), and at most 20,000 faces. No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Speaker"]

[[checks]]
type = "transforms_applied"
objects = ["Speaker"]

[[checks]]
type = "bbox"
object = "Speaker"
min = [-0.07, -0.06, -0.01]
max = [0.07, 0.06, 0.2]
tol = 0.0002

[[checks]]
type = "watertight"
objects = ["Speaker"]

[[checks]]
type = "shells"
objects = ["Speaker"]

[[checks]]
type = "self_intersection"
objects = ["Speaker"]

[[checks]]
type = "topology"
objects = ["Speaker"]

[[checks]]
type = "face_budget"
objects = ["Speaker"]
max = 20000

# box 200*(140*120 - (4-pi)*6^2) - recess pi*50^2*4 + feet 4*pi*12^2*10
#   = 3353819.5 - 31415.9 + 18095.6
# Tolerance 0.2%: no feet (-0.54%) and half-buried feet (-0.27%) must fail, any segment count must pass.
[[checks]]
type = "volume"
object = "Speaker"
mm3 = 3340499
rel_tol = 0.002

[[checks]]
type = "ray_probe"
label = "probe_feet"
objects = ["Speaker"]
tol = 0.0002
probes = [
  { name = "foot bottom +X+Y", origin = [0.05, 0.04, -0.05], dir = [0, 0, 1], hit = 0.04 },
  { name = "foot bottom +X-Y", origin = [0.05, -0.04, -0.05], dir = [0, 0, 1], hit = 0.04 },
  { name = "foot bottom -X+Y", origin = [-0.05, 0.04, -0.05], dir = [0, 0, 1], hit = 0.04 },
  { name = "foot bottom -X-Y", origin = [-0.05, -0.04, -0.05], dir = [0, 0, 1], hit = 0.04 },
  { name = "foot side +X, 12 mm radius", origin = [0.1, 0.04, -0.005], dir = [-1, 0, 0], hit = 0.038 },
  { name = "foot side -X", origin = [-0.1, -0.04, -0.005], dir = [1, 0, 0], hit = 0.038 },
  { name = "foot side -Y (front)", origin = [0.05, -0.1, -0.005], dir = [0, 1, 0], hit = 0.048 },
  { name = "foot side +Y (back)", origin = [-0.05, 0.1, -0.005], dir = [0, -1, 0], hit = 0.048 },
]

[[checks]]
type = "ray_probe"
label = "probe_unchanged"
objects = ["Speaker"]
tol = 0.0002
probes = [
  { name = "top face", origin = [0.0, 0.0, 0.3], dir = [0, 0, -1], hit = 0.1 },
  { name = "base between the feet", origin = [0.0, 0.0, -0.05], dir = [0, 0, 1], hit = 0.05 },
  { name = "side +X", origin = [0.2, 0.0, 0.1], dir = [-1, 0, 0], hit = 0.13 },
  { name = "corner radius 6", origin = [0.08, 0.07, 0.1], dir = [-1, -1, 0], hit = 0.016627 },
  { name = "front face above recess", origin = [0.0, -0.2, 0.185], dir = [0, 1, 0], hit = 0.14 },
  { name = "recess floor", origin = [0.0, -0.2, 0.11], dir = [0, 1, 0], hit = 0.144 },
  { name = "recess wall, 50 mm radius", origin = [0.0, -0.058, 0.11], dir = [1, 0, 0], hit = 0.05 },
]

[variants]
good = []
unchanged = ["bbox", "volume", "probe_feet"]
box_lifted = ["bbox", "probe_feet", "probe_unchanged"]
edge_measured = ["probe_feet"]
feet_centred_on_base = ["bbox", "volume", "probe_feet"]
joined_not_fused = ["shells", "self_intersection"]
rebuilt_plain = ["volume", "probe_unchanged"]

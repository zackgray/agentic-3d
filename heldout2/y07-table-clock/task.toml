id = "y07"
title = "Table clock: flat-bottomed disc body with a front face recess, crown button and two feet"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a table clock, as four separate mesh objects. Units are metres (1 Blender unit = 1 m). The clock stands on its two feet on the ground plane, centred on the world Z axis. Its front face is the side facing -Y and its back face is the side facing +Y.

Body (mesh object "Body"), one solid part:
- Disc: a solid cylinder 110 mm in diameter with its axis along Y at (x, z) = (0, 62) mm, from a flat back face at y = +20 mm to a flat front face at y = -20 mm (40 mm thick). The edges where the round side meets the front and back faces are sharp.
- Flat bottom: the disc is cut off by a horizontal plane at z = 12 mm, leaving a flat underside there (the round side meets it in sharp edges).
- Face recess: a round pocket 80 mm in diameter cut into the front face, centred on the disc axis, 3 mm deep with a flat floor at y = -17 mm and sharp edges.
- Crown pocket: a round pocket 12 mm in diameter cut down into the top of the disc, its axis vertical at (x, y) = (0, 0), with a flat floor at z = 112 mm.

Crown (mesh object "Crown"): a solid cylinder 11 mm in diameter, its axis vertical at (x, y) = (0, 0), from z = 112.5 mm to a flat top at z = 122 mm. It sits in the crown pocket 0.5 mm above its floor and clears its wall by 0.5 mm all round.

Feet (mesh objects "FootLeft" and "FootRight"): two solid rectangular blocks, each 14 mm in X by 30 mm in Y (y from -15 mm to +15 mm), from z = 0 to a flat top at z = 11.5 mm, so they clear the body's flat underside by 0.5 mm. FootLeft spans x from -20 mm to -6 mm; FootRight spans x from +6 mm to +20 mm. Sharp edges.

All four objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""


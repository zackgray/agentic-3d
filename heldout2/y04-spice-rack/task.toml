id = "y04-spice-rack"
title = "Two-tier spice rack with four jars, each clear of its tier"
group = "layout"
starting_scene = "empty"

prompt = """
Lay out a product shot in the open Blender scene: a two-tier stepped spice rack with four identical hypothetical spice jars on it, as five mesh objects. Units are metres (1 Blender unit = 1 m). The rack stands on the ground plane, centred on the world Z axis in X; the front of the scene faces -Y.

Rack (mesh object "Rack"), one solid stepped block, all edges sharp, its sides parallel to the world axes:
- Front tier: x from -90 mm to +90 mm, y from -45 mm to 0, from the ground (z = 0) to a flat top at z = 25 mm.
- Back tier: x from -90 mm to +90 mm, y from 0 to +45 mm, from the ground to a flat top at z = 60 mm.
- The two tiers are one fused piece: seen from the side (along X) the rack's profile is an L, with a vertical face at y = 0 between z = 25 mm and z = 60 mm.

Jars (mesh objects "Jar_FL", "Jar_FR", "Jar_BL" and "Jar_BR"), four identical closed cylinders, axes vertical:
- Each is 36 mm in diameter and 72 mm tall, with a flat bottom, a flat top and sharp edges.
- Every jar stands on its tier with its bottom 0.4 mm above the tier top, so no jar touches the rack.
- Front tier, axes on the line y = -22.5 mm, bottoms at z = 25.4 mm: "Jar_FL" with its axis at x = -50 mm and "Jar_FR" at x = +50 mm.
- Back tier, axes on the line y = +22.5 mm, bottoms at z = 60.4 mm: "Jar_BL" with its axis at x = -25 mm and "Jar_BR" at x = +25 mm (a 14 mm gap between the two back jars).

Every object:
- A single closed (watertight) mesh, one connected piece, with consistent outward normals and no self-intersections. No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 5,000 faces each.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "transforms_applied"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "watertight"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "shells"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "self_intersection"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "topology"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]

[[checks]]
type = "face_budget"
objects = ["Jar_BL", "Jar_BR", "Jar_FL", "Jar_FR", "Rack"]
max = 5000

[[checks]]
type = "bbox"
label = "bbox_rack"
object = "Rack"
min = [-0.09, -0.045, 0.0]
max = [0.09, 0.045, 0.06]
tol = 0.0003


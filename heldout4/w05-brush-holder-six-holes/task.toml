id = "w05-brush-holder-six-holes"
title = "Revision: six brush holes instead of four, evenly spaced on the same circle"
group = "revision"
starting_scene = "start.py"

prompt = """
The open Blender scene holds an approved model of a hypothetical product: a makeup-brush holder, a solid turned puck with a rounded top edge, a round well in the middle of its top and a ring of round brush holes around it (mesh object "Holder"). It stands on the ground plane, centred on the world Z axis. Units are metres (1 Blender unit = 1 m). The client has one revision:

- The ring of four brush holes becomes a ring of six, evenly spaced (60 degrees apart) on the same circle as the current holes, with one hole still centred on the +X axis.
- Every hole keeps exactly its current diameter and depth, with the same flat floor, and still runs straight down from the top face.
- Any old hole that is not part of the new ring is filled flush with the top face: no trace of it remains.
- Everything else stays exactly as it is: the puck's diameter and height, the rounded top edge, and the centre well.

The object keeps its name. It stays a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections, transforms applied (location at the origin, no rotation, scale 1), and at most 20,000 faces. No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Holder"]

[[checks]]
type = "transforms_applied"
objects = ["Holder"]

[[checks]]
type = "bbox"
object = "Holder"
min = [-0.045, -0.045, 0.0]
max = [0.045, 0.045, 0.05]
tol = 0.0002

[[checks]]
type = "watertight"
objects = ["Holder"]

[[checks]]
type = "shells"
objects = ["Holder"]

[[checks]]
type = "self_intersection"
objects = ["Holder"]

[[checks]]
type = "topology"
objects = ["Holder"]

[[checks]]
type = "face_budget"
object = "Holder"
max = 20000

# pi*45^2*50 - top round 2*pi*(45 - xb)*r^2*(1 - pi/4) [r = 4, spandrel centroid xb = r*(10-3*pi)/(12-3*pi)
# = 0.8935 from the corner] - centre well pi*10^2*38 - 6 holes pi*8^2*38. One hole is 7640 mm3 = 2.9%,
# the centre well 4.6%. A 24-segment build of everything loses ~1.2% (the puck's outside dominates), so
# the tolerance is 1.5% and the rounded edge (0.37%) is left to the probes.
[[checks]]
type = "volume"
object = "Holder"
mm3 = 259355
rel_tol = 0.015

# Hole probes fire straight down at the floor and at 7.5 mm (open) / 8.5 mm (solid) from each hole's
# centre, radially out and in, so any segment count of 24 or more passes (24-gon inradius 7.93 mm).

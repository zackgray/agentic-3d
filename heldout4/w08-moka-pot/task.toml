label = "bbox_jug"
object = "Jug"
min = [-0.105, -0.046, 0.0725]
max = [0.046, 0.046, 0.15]
tol = 0.0003

[[checks]]
type = "bbox"
label = "bbox_lid"
object = "Lid"
min = [-0.046, -0.046, 0.1505]
max = [0.046, 0.046, 0.17]
tol = 0.0003

[[checks]]
type = "watertight"
objects = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "shells"
objects = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "self_intersection"
objects = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "topology"
objects = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "face_budget"
objects = ["Boiler", "Jug", "Lid", "Valve"]
max = 20000

[[checks]]
type = "no_overlap"
label = "no_overlap_boiler_valve"
a = "Boiler"
b = "Valve"

[[checks]]
type = "no_overlap"
label = "no_overlap_boiler_jug"
a = "Boiler"
b = "Jug"

[[checks]]
type = "no_overlap"
label = "no_overlap_jug_lid"
a = "Jug"
b = "Lid"

# O(F) = 2*(sqrt(2) - 1)*F^2 is the octagon's area; frustum h/3*(O1 + O2 + sqrt(O1*O2)).
# 72/3*(O(96) + O(80) + sqrt(O(96)*O(80))) + boss pi*6^2*(50 - 44), the +X face being at x 44 on the boss axis
[[checks]]
type = "volume"
label = "volume_boiler"
object = "Boiler"
mm3 = 463856
rel_tol = 0.01

# (sqrt(3)/2)*14^2*5.5
[[checks]]
type = "volume"
label = "volume_valve"
object = "Valve"
mm3 = 933.6
rel_tol = 0.01

# frustum 77.5 (O(80) to O(92)) - cavity frustum 73.5 (O(74) to O(86))
# + handle 14*12*(105 - 43.5226), the -X face being at x -(40 + 6*(118 - 72.5)/77.5) at mid-height z 118
[[checks]]
type = "volume"
label = "volume_jug"
object = "Jug"
mm3 = 95522
rel_tol = 0.01

# O(92)*3.5 + chamfer frustum 2 (O(92) to O(88)) + stem pi*5^2*6 + cap pi*12^2*8
# - fillet ring by Pappus: (1 - pi/4)*3^2 at radius 12 - 3*(10 - 3*pi)/(3*(4 - pi))
[[checks]]
type = "volume"
label = "volume_lid"
object = "Lid"
mm3 = 41917
rel_tol = 0.01


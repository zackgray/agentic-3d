id = "w08-moka-pot"
title = "Stovetop espresso pot: octagonal tapered boiler with valve boss, hex valve, hollow octagonal jug with handle, chamfered lid with filleted knob"
group = "multi-step"
starting_scene = "empty"

prompt = """
Model a hypothetical product in the open Blender scene: a stovetop espresso pot, as four separate mesh objects stacked on the world Z axis. Units are metres (1 Blender unit = 1 m). The boiler stands on the ground plane and every part is centred on the world Z axis (except where a position is given); the handle points towards -X.

An "octagon F" below is a regular octagon centred on the Z axis, F mm across its flats, with one flat facing each of +X, -X, +Y and -Y (and the other four facing the diagonals), so it reaches x = +-F/2 and y = +-F/2. An "octagonal frustum" is a solid whose horizontal sections are octagons whose size changes linearly with height (flat sides, straight edges between the corners).

Boiler (mesh object "Boiler"), one solid part:
- Body: an octagonal frustum from a flat bottom at z = 0, octagon 96, narrowing to a flat top at z = 72 mm, octagon 80. All edges are sharp.
- Valve boss: a round cylinder 12 mm in diameter lying along X, its axis at (y, z) = (0, 36) mm, fused to the +X side face and sticking out to a flat end at x = +50 mm.

Valve (mesh object "Valve"): a hexagonal prism lying along X on the boss axis ((y, z) = (0, 36) mm), 14 mm across its flats, with two of its flats horizontal (facing up and down), from a flat face at x = +50.5 mm (0.5 mm clear of the boss end) to a flat face at x = +56 mm. All edges are sharp.

Jug (mesh object "Jug"), one solid part:
- Body: an octagonal frustum that widens upwards, from a flat bottom at z = 72.5 mm (0.5 mm above the boiler top), octagon 80, to its top rim at z = 150 mm, octagon 92.
- Cavity: open at the top, an octagonal frustum pocket (same orientation) from a flat floor at z = 76.5 mm, octagon 74, widening to octagon 86 where it meets the top rim at z = 150 mm. So the rim is a flat octagonal ring at z = 150 mm, 3 mm wide.
- Handle: a straight bar of square-cornered rectangular section, y from -7 mm to +7 mm and z from 112 mm to 124 mm, fused to the outside of the -X wall (it must not break into the cavity) and running out horizontally to a flat end at x = -105 mm.
All edges are sharp.

Lid (mesh object "Lid"), one solid part:
- Plate: octagon 92 with vertical sides from a flat underside at z = 150.5 mm (0.5 mm above the jug rim) up to z = 154 mm. Its top edge all the way round is a 2 mm by 2 mm 45-degree chamfer, so the flat top face at z = 156 mm is octagon 88.
- Knob, turned about the Z axis and fused to the plate: a stem 10 mm in diameter from the plate top up to z = 162 mm, then a cap 24 mm in diameter from z = 162 mm to a flat top at z = 170 mm. The cap's top circular edge is rounded with a 3 mm radius fillet (a quarter-round blending its side into its top face); the cap's bottom edge is sharp.

All four objects:
- Each is a single closed (watertight) mesh in one connected piece, with consistent outward normals and no self-intersections.
- No two objects touch or intersect.
- Transforms applied: location at the origin, no rotation, scale 1, so the mesh data holds world coordinates.
- At most 20,000 faces per object.
- No other mesh objects in the scene.

Mesh hygiene: no duplicate or coincident vertices, no zero-length edges and no zero-area faces. Merge any coincident vertices before you finish.

Tell me when you're done.
"""

[[checks]]
type = "objects"
expected = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "transforms_applied"
objects = ["Boiler", "Jug", "Lid", "Valve"]

[[checks]]
type = "bbox"
label = "bbox_boiler"
object = "Boiler"
min = [-0.048, -0.048, 0.0]
max = [0.05, 0.048, 0.072]
tol = 0.0003

# Hexagon corners at y = +-7/cos(30 deg)
[[checks]]
type = "bbox"
label = "bbox_valve"
object = "Valve"
min = [0.0505, -0.008083, 0.029]
max = [0.056, 0.008083, 0.043]
tol = 0.0003

[[checks]]
